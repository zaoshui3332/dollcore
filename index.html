<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dollcore</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="page-gate" class="gate" style="display:none">
    <canvas id="particles"></canvas>
    <div class="gate-bg-shapes">
      <div class="gate-shape gate-shape-1"></div>
      <div class="gate-shape gate-shape-2"></div>
    </div>
    <div class="gate-card" id="gate-card">
      <h1 class="gate-logo">Dollcore</h1>
      <p class="gate-poem">娉娉袅袅十三余，豆蔻梢头二月初。</p>
      <div class="gate-divider"></div>
      <p class="gate-hint">请输入验证信息以继续</p>
      <form id="gate-form" class="gate-form">
        <input id="gate-input" class="gate-input" type="text" placeholder="验证信息..." autofocus />
        <p id="gate-error" class="gate-error" style="display:none">验证信息错误，请重试</p>
        <button type="submit" class="gate-btn">
          <span>进入</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
    <div class="gate-theme-row">
      <button class="theme-toggle" id="theme-toggle-gate" title="切换主题">
        <span class="theme-opt dark-opt active">暗</span>
        <span class="theme-opt light-opt">亮</span>
      </button>
    </div>
  </div>

  <div id="app">
    <nav class="navbar">
      <div class="inner">
        <a href="#" class="logo" data-nav="home">Dollcore</a>
        <div class="links">
          <a href="#" data-nav="home">首页</a>
          <button class="theme-toggle" id="theme-toggle-nav" title="切换主题">
            <span class="theme-opt dark-opt active">暗</span>
            <span class="theme-opt light-opt">亮</span>
          </button>
        </div>
      </div>
    </nav>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <a href="#" class="sidebar-item active" data-section="software">
          <span>软件</span>
        </a>
        <a href="#" class="sidebar-item" data-section="websites">
          <span>网站</span>
        </a>
      </aside>

      <main class="main">
        <div id="page-home" class="page" style="display:none">
          <div class="hero">
            <h1 id="hero-title">软件中心</h1>
            <p id="hero-desc">发现和下载软件。</p>
          </div>
          <div class="toolbar-row">
            <form id="search-form">
              <input id="search-input" placeholder="搜索..." />
              <button type="submit" class="btn btn-primary">搜索</button>
            </form>
            <select id="category-filter"><option value="">全部分类</option></select>
          </div>
          <div id="card-grid" class="grid"></div>
          <div id="home-empty" class="empty" style="display:none">
            <div class="icon">📦</div>
            <h3>暂无内容</h3>
            <p>暂无条目。</p>
          </div>
        </div>

        <div id="page-detail" class="page detail" style="display:none">
          <a href="#" class="back" data-nav="home">&larr; 返回首页</a>
          <h1 id="detail-name"></h1>
          <div class="info" id="detail-info"></div>
          <div class="desc" id="detail-desc"></div>
          <div class="actions">
            <button class="btn btn-primary" id="detail-action">下载</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
